syntax = "proto3";

package rial.matching.v1;

import "google/protobuf/timestamp.proto";

// ============== Orders ==============

enum Side {
  SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  MARKET = 1;
  LIMIT = 2;
  ICEBERG = 3;
  STOP = 4;
  STOP_LIMIT = 5;
  TRAILING_STOP = 6;
}

enum TimeInForce {
  TIF_UNSPECIFIED = 0;
  GTC = 1;   // Good Till Cancel
  IOC = 2;   // Immediate Or Cancel
  FOK = 3;   // Fill Or Kill
  GTD = 4;   // Good Till Date
  DAY = 5;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  NEW = 1;
  PARTIALLY_FILLED = 2;
  FILLED = 3;
  CANCELED = 4;
  REJECTED = 5;
  EXPIRED = 6;
}

message Order {
  string id = 1;
  string client_order_id = 2;
  string market = 3;            // e.g. "RIAL-USD"
  string user_id = 4;
  Side side = 5;
  OrderType type = 6;
  TimeInForce tif = 7;
  string price = 8;              // decimal as string
  string quantity = 9;           // decimal as string
  string filled_quantity = 10;
  string remaining_quantity = 11;
  string stop_price = 12;
  string trailing_delta = 13;
  string iceberg_visible_qty = 14;
  OrderStatus status = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  uint64 sequence = 18;
}

message Trade {
  string id = 1;
  string market = 2;
  string buyer_order_id = 3;
  string seller_order_id = 4;
  string buyer_user_id = 5;
  string seller_user_id = 6;
  Side taker_side = 7;
  string price = 8;
  string quantity = 9;
  string taker_fee = 10;
  string maker_fee = 11;
  string taker_fee_asset = 12;
  string maker_fee_asset = 13;
  google.protobuf.Timestamp executed_at = 14;
  uint64 sequence = 15;
}

// ============== Book ==============

message PriceLevel {
  string price = 1;
  string quantity = 2;
  uint32 order_count = 3;
}

message OrderBookSnapshot {
  string market = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp as_of = 5;
}

message BBO {
  string market = 1;
  string best_bid = 2;
  string best_bid_qty = 3;
  string best_ask = 4;
  string best_ask_qty = 5;
  uint64 sequence = 6;
  google.protobuf.Timestamp as_of = 7;
}

// ============== Service ==============

message SubmitOrderRequest {
  Order order = 1;
}

message SubmitOrderResponse {
  Order order = 1;
  repeated Trade trades = 2;
  repeated OrderStatusUpdate status_updates = 3;
}

message OrderStatusUpdate {
  string order_id = 1;
  OrderStatus status = 2;
  string filled_quantity = 3;
  string remaining_quantity = 4;
}

message CancelOrderRequest {
  string market = 1;
  string order_id = 2;
  string user_id = 3;
}

message CancelOrderResponse {
  bool canceled = 1;
  Order order = 2;
}

message CancelAllRequest {
  string user_id = 1;
  string market = 2; // optional
}

message CancelAllResponse {
  uint32 canceled_count = 1;
  repeated string order_ids = 2;
}

message GetOrderRequest {
  string market = 1;
  string order_id = 2;
}

message GetOrderResponse {
  Order order = 1;
}

message GetOrderBookRequest {
  string market = 1;
  uint32 depth = 2;
}

message GetOrderBookResponse {
  OrderBookSnapshot snapshot = 1;
}

message StreamOrderBookRequest {
  string market = 1;
}

message StreamTradesRequest {
  string market = 1;
}

message PingRequest {}
message PongResponse { string version = 1; uint64 uptime_secs = 2; }

service MatchingEngine {
  rpc Ping(PingRequest) returns (PongResponse);
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc CancelAll(CancelAllRequest) returns (CancelAllResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
  rpc StreamOrderBook(StreamOrderBookRequest) returns (stream OrderBookSnapshot);
  rpc StreamTrades(StreamTradesRequest) returns (stream Trade);
}
