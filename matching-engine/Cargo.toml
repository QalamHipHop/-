[package]
name = "matching-engine"
version = "0.1.0"
edition = "2021"
description = "Low-latency matching engine for the Rial platform"
license = "Proprietary"

[[bin]]
name = "matching-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.1"
parking_lot = "0.12"
rust_decimal = { version = "1.36", features = ["serde"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio-stream = "0.1"
async-nats = "0.37"
futures = "0.3"
bincode = "1.3"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
hyper = { version = "1.4", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = "0.5"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
