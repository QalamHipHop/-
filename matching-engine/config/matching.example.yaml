# Matching engine runtime configuration.
# Mounted at /etc/rial/matching.yaml in containers.

grpc:
  addr: "0.0.0.0:50051"
  max_concurrent_streams: 1000
  keepalive_secs: 30

health:
  addr: "0.0.0.0:8081"

metrics:
  addr: "0.0.0.0:9101"
  namespace: "rial_matching"

# Runtime environment: MATCHING_SNAPSHOT_PATH=/var/lib/rial/matching/state.json
# Mount this path on durable storage. If unset, the engine is intentionally in-memory.
# Trade bridge environment: MATCHING_NATS_URL=nats://nats:4222
# Optional subject override: MATCHING_TRADE_SUBJECT=trading.trade.executed
persistence:
  snapshot_path: "/var/lib/rial/matching/state.json"

fees:
  taker_bps: 30
  maker_bps: 10

markets:
  - "RIAL-USD"
  - "RIAL-USDT"
  - "RIAL-BTC"

broadcast:
  nats:
    url: "nats://nats:4222"
    subject_trades: "trading.trade.executed"
    subject_book: "trading.orderbook.updated"
