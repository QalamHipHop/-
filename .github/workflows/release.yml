name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - backend
          - frontend
          - matching-engine
          - trading-engine
          - wallet-service
          - launchpad-service
          - payment-service
          - notification-service
          - analytics
          - ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rial-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/rial-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
