user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=ip:10m rate=50r/s;
    limit_req_zone $http_x_user_id     zone=user:10m rate=20r/s;

    # Real IP behind reverse proxy / load balancer
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Security headers (set globally, can be overridden per-loc)
    add_header X-Frame-Options                "SAMEORIGIN"     always;
    add_header X-Content-Type-Options         "nosniff"        always;
    add_header Referrer-Policy                "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy             "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security      "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/*.conf;
}
