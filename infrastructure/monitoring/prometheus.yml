global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: rial-dev

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  # The matching engine exposes gRPC on 50051, health on 8081 and
  # Prometheus metrics on a separate HTTP listener at 9101.
  - job_name: matching-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["matching-engine:9101"]

  # Trading health and metrics share the configured health listener.
  - job_name: trading-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["trading-engine:50082"]

  - job_name: wallet-service
    metrics_path: /metrics
    static_configs:
      - targets: ["wallet-service:50053"]

  - job_name: launchpad-service
    metrics_path: /metrics
    static_configs:
      - targets: ["launchpad-service:50054"]

  # Payment and notification currently expose liveness only. They are not
  # scraped as metrics until a real exporter is implemented for each service.
  - job_name: analytics
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics:50057"]

  - job_name: ai-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-engine:50058"]
