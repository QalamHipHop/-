// RIAL wallet-service gRPC contract
syntax = "proto3";
package rial.wallet.v1;

option go_package = "github.com/rial/wallet-service/proto;rialpb";

service WalletService {
  rpc GetAccount(GetAccountRequest) returns (Account);
  rpc Credit(CreditRequest) returns (Transaction);
  rpc Debit(DebitRequest) returns (Transaction);
  rpc Transfer(TransferRequest) returns (TransferResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc RequestWithdrawal(WithdrawalRequest) returns (Withdrawal);
  rpc SignWithdrawal(SignWithdrawalRequest) returns (Withdrawal);
}

message Account {
  string id = 1;
  string owner_id = 2;
  string kind = 3;
  string symbol = 4;
  int64 balance = 5;
  int64 available = 6;
  int64 pending = 7;
  int64 version = 8;
}

message Transaction {
  string id = 1;
  string account_id = 2;
  string type = 3;
  int64 amount = 4;
  int64 balance_after = 5;
  string reference = 6;
  string actor = 7;
  string idempotency_key = 8;
  int64 created_at_unix_ms = 9;
}

message Withdrawal {
  string id = 1;
  string account_id = 2;
  int64 amount = 3;
  string destination = 4;
  string chain = 5;
  string status = 6;
  string tx_hash = 7;
  repeated string signers = 8;
  int32 required_sigs = 9;
  int64 created_at_unix_ms = 10;
}

message GetAccountRequest { string user_id = 1; }

message CreditRequest {
  string user_id = 1;
  int64 amount = 2;
  string type = 3;
  string reference = 4;
  string idempotency_key = 5;
  map<string, string> metadata = 6;
}
message DebitRequest { string user_id = 1; int64 amount = 2; string type = 3; string reference = 4; string idempotency_key = 5; }
message TransferRequest { string from_user_id = 1; string to_user_id = 2; int64 amount = 3; string reference = 4; string actor = 5; string idempotency_key = 6; }
message TransferResponse { bool ok = 1; }
message ListTransactionsRequest { string user_id = 1; int32 limit = 2; int32 offset = 3; }
message ListTransactionsResponse { repeated Transaction items = 1; }
message WithdrawalRequest { string user_id = 1; int64 amount = 2; string chain = 3; string destination = 4; string idempotency_key = 5; }
message SignWithdrawalRequest { string withdrawal_id = 1; string signer_id = 2; }
